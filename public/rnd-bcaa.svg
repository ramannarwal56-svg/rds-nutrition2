<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="600" height="650">
  <defs>
    <linearGradient id="bcaaJarMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bcaaPinkFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="bcaaGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <ellipse cx="300" cy="580" rx="190" ry="22" fill="#000000" fill-opacity="0.5" filter="blur(10px)"/>
  <ellipse cx="300" cy="578" rx="150" ry="14" fill="#000000" fill-opacity="0.75" filter="blur(4px)"/>

  <g filter="url(#packShadow)">
    <rect x="140" y="150" width="320" height="405" rx="36" fill="url(#bcaaJarMetal)" stroke="#64748b" stroke-width="2"/>
    <rect x="145" y="90" width="310" height="74" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="155" y="96" width="290" height="10" rx="5" fill="url(#bcaaPinkFoil)" opacity="0.8"/>

    <rect x="150" y="175" width="300" height="355" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 150 175 L 330 175 L 280 530 L 150 530 Z" fill="#090d16"/>
    <polygon points="330,175 350,175 300,530 280,530" fill="url(#bcaaPinkFoil)"/>

    <g stroke="#cbd5e1" stroke-width="1.2" fill="none" opacity="0.6">
      <polygon points="380,210 395,200 410,210 410,228 395,238 380,228" />
      <polygon points="395,238 410,228 425,238 425,256 410,266 395,256" />
      <polygon points="380,410 395,400 410,410 410,428 395,438 380,428" />
    </g>

    <g transform="translate(175, 225)">
      <text x="0" y="0" fill="url(#bcaaGoldFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="2">RND</text>
      <circle cx="80" cy="-20" r="4.5" fill="none" stroke="url(#bcaaGoldFoil)" stroke-width="1.5"/>
      <text x="80" y="-17" fill="url(#bcaaGoldFoil)" font-family="sans-serif" font-size="6" text-anchor="middle" font-weight="bold">R</text>
    </g>

    <text x="175" y="270" fill="url(#bcaaPinkFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">RECHARGE™</text>
    <text x="175" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1">BCAA 2:1:1</text>
    <text x="175" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5">INTRA-WORKOUT RECOVERY MATRIX</text>

    <g transform="translate(170, 355)">
      <rect x="0" y="0" width="110" height="32" rx="8" fill="#1e293b" stroke="url(#bcaaPinkFoil)" stroke-width="1"/>
      <text x="25" y="22" fill="url(#bcaaPinkFoil)" font-family="sans-serif" font-weight="900" font-size="16">7g</text>
      <text x="50" y="16" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">BCAA</text>
      <text x="50" y="25" fill="#94a3b8" font-family="sans-serif" font-size="7">2:1:1 RATIO</text>

      <rect x="120" y="0" width="110" height="32" rx="8" fill="#1e293b" stroke="url(#bcaaPinkFoil)" stroke-width="1"/>
      <text x="140" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14">ZERO</text>
      <text x="180" y="16" fill="url(#bcaaPinkFoil)" font-family="sans-serif" font-weight="bold" font-size="8">SUGAR</text>
      <text x="180" y="25" fill="#94a3b8" font-family="sans-serif" font-size="7">CALORIES</text>
    </g>

    <g transform="translate(170, 480)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4.5" fill="#10b981"/>
      <text x="28" y="14" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13">NET WT. 100g / 250g</text>
    </g>
