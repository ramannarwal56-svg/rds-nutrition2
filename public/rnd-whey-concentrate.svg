<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="600" height="650">
  <defs>
    <linearGradient id="wpcJarMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="20%" stop-color="#64748b" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="wpcEmeraldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="wpcGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <ellipse cx="300" cy="585" rx="210" ry="24" fill="#000000" fill-opacity="0.5" filter="blur(10px)"/>
  <ellipse cx="300" cy="582" rx="170" ry="14" fill="#000000" fill-opacity="0.75" filter="blur(4px)"/>

  <g filter="url(#packShadow)">
    <rect x="125" y="150" width="350" height="415" rx="40" fill="url(#wpcJarMetal)" stroke="#64748b" stroke-width="2"/>
    <rect x="135" y="85" width="330" height="74" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="145" y="92" width="310" height="10" rx="5" fill="url(#wpcEmeraldFoil)" opacity="0.8"/>

    <rect x="140" y="175" width="320" height="365" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 140 175 L 340 175 L 290 540 L 140 540 Z" fill="#090d16"/>
    <polygon points="340,175 360,175 310,540 290,540" fill="url(#wpcEmeraldFoil)"/>

    <!-- Honeycomb -->
    <g stroke="#cbd5e1" stroke-width="1.2" fill="none" opacity="0.6">
      <polygon points="390,210 405,200 420,210 420,228 405,238 390,228" />
      <polygon points="415,238 430,228 445,238 445,256 430,266 415,256" />
      <polygon points="380,410 395,400 410,410 410,428 395,438 380,428" />
    </g>

    <!-- RND Logo -->
    <g transform="translate(170, 225)">
      <text x="0" y="0" fill="url(#wpcGoldFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="2">RND</text>
      <circle cx="85" cy="-20" r="4.5" fill="none" stroke="url(#wpcGoldFoil)" stroke-width="1.5"/>
      <text x="85" y="-17" fill="url(#wpcGoldFoil)" font-family="sans-serif" font-size="6" text-anchor="middle" font-weight="bold">R</text>
    </g>

    <!-- Product Title -->
    <text x="170" y="270" fill="url(#wpcEmeraldFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">PRO-CORE™</text>
    <text x="170" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="1">WHEY CONCENTRATE</text>
    <text x="170" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5">COLD MICROFILTERED BIO-ENZYMES</text>

    <!-- Badges -->
    <g transform="translate(160, 355)">
      <rect x="0" y="0" width="115" height="32" rx="8" fill="#1e293b" stroke="url(#wpcEmeraldFoil)" stroke-width="1"/>
      <text x="25" y="22" fill="url(#wpcEmeraldFoil)" font-family="sans-serif" font-weight="900" font-size="16">24g</text>
      <text x="55" y="16" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">PROTEIN</text>
      <text x="55" y="25" fill="#94a3b8" font-family="sans-serif" font-size="7">PER SCOOP</text>

      <rect x="125" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="url(#wpcEmeraldFoil)" stroke-width="1"/>
      <text x="145" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16">5.5g</text>
      <text x="180" y="16" fill="url(#wpcEmeraldFoil)" font-family="sans-serif" font-weight="bold" font-size="8">BCAA</text>
      <text x="180" y="25" fill="#94a3b8" font-family="sans-serif" font-size="7">NATURAL</text>
    </g>

    <g transform="translate(160, 400)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="#059669"/>
      <text x="70" y="18" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">DIGESTIVE ENZYMES</text>
    </g>

    <!-- Weight & Veg dot -->
    <g transform="translate(160, 480)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="4.5" fill="#10b981"/>
      <text x="28" y="14" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13">NET WT. 1 KG (2.2 LBS)</text>
    </g>
  </g>
</svg>
