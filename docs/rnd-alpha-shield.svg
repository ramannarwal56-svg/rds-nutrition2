<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="600" height="650">
  <defs>
    <!-- Dark Bottle Metallic/Amber Gradients -->
    <linearGradient id="alphaBottleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="20%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="alphaLidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Foil Logo Gradient -->
    <linearGradient id="alphaGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Studio Floor Shadow -->
  <ellipse cx="300" cy="580" rx="190" ry="22" fill="#000000" fill-opacity="0.5" filter="blur(10px)"/>
  <ellipse cx="300" cy="578" rx="150" ry="14" fill="#000000" fill-opacity="0.75" filter="blur(4px)"/>

  <!-- Main Container -->
  <g filter="url(#packShadow)">
    <!-- Sleek Bottle Body -->
    <rect x="150" y="160" width="300" height="400" rx="30" fill="url(#alphaBottleMetal)" stroke="#64748b" stroke-width="2"/>

    <!-- Bottle Neck -->
    <path d="M 190 160 L 410 160 L 390 125 L 210 125 Z" fill="url(#alphaLidGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Bottle Screw Cap -->
    <rect x="200" y="70" width="200" height="65" rx="12" fill="url(#alphaLidGrad)" stroke="#64748b" stroke-width="2"/>
    <rect x="210" y="75" width="180" height="10" rx="5" fill="url(#alphaGoldFoil)" opacity="0.9"/>

    <!-- Ribbing -->
    <path d="M 215 88 L 215 125 M 230 88 L 230 125 M 245 88 L 245 125 M 260 88 L 260 125 M 275 88 L 275 125 M 290 88 L 290 125 M 305 88 L 305 125 M 320 88 L 320 125 M 335 88 L 335 125 M 350 88 L 350 125 M 365 88 L 365 125 M 380 88 L 380 125" stroke="#334155" stroke-width="2"/>

    <!-- Main Label Wrap -->
    <rect x="160" y="180" width="280" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Honeycomb Hexagonal Pattern -->
    <g stroke="#cbd5e1" stroke-width="1.2" fill="none" opacity="0.55">
      <polygon points="390,220 405,210 420,220 420,238 405,248 390,238" />
      <polygon points="405,248 420,238 435,248 435,266 420,276 405,266" />
      <polygon points="375,248 390,238 405,248 405,266 390,276 375,266" />
      <polygon points="390,276 405,266 420,276 420,294 405,304 390,294" />
      <polygon points="370,410 385,400 400,410 400,428 385,438 370,428" />
      <polygon points="385,438 400,428 415,438 415,456 400,466 385,456" />
    </g>

    <!-- Left Dark Strip -->
    <rect x="160" y="180" width="52" height="360" rx="10" fill="#0f172a"/>
    <!-- Veg Square Dot -->
    <rect x="174" y="198" width="24" height="24" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <circle cx="186" cy="210" r="5" fill="#10b981" />

    <!-- Vertical "ALPHA SHIELD" text -->
    <g transform="translate(196, 460) rotate(-90)">
      <text x="0" y="0" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3">ALPHA SHIELD</text>
    </g>

    <!-- RND Logo Container Polygon -->
    <polygon points="230,190 385,190 370,255 245,255" fill="#0f172a" stroke="url(#alphaGoldFoil)" stroke-width="2"/>
    <!-- RND Text in Logo -->
    <g transform="translate(308, 235)">
      <text x="-36" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="2">R</text>
      <text x="-10" y="0" fill="url(#alphaGoldFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="2">N</text>
      <text x="16" y="0" fill="url(#alphaGoldFoil)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="2">D</text>
      <text x="42" y="-12" fill="url(#alphaGoldFoil)" font-family="sans-serif" font-weight="bold" font-size="9">TM</text>
    </g>

    <!-- Product Title -->
    <text x="325" y="295" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1">ADVANCED ATHLETE FORMULA</text>
    <text x="325" y="332" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="1">MULTIVITAMIN</text>
    <text x="325" y="360" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">45 ACTIVES • IMMUNITY &amp; ENERGY</text>

    <!-- Pills Section -->
    <g transform="translate(225, 390)">
      <!-- Pill 1: 45 Actives -->
      <rect x="0" y="0" width="100" height="34" rx="17" fill="#0f172a"/>
      <text x="18" y="22" fill="#60a5fa" font-family="sans-serif" font-weight="900" font-size="16">45</text>
      <text x="44" y="16" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="7">ACTIVES</text>
      <text x="44" y="25" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="6">100% RDA</text>

      <!-- Pill 2: Trustified Certified -->
      <rect x="106" y="0" width="95" height="34" rx="17" fill="url(#alphaGoldFoil)"/>
      <text x="153" y="15" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle">TRUSTIFIED</text>
      <text x="153" y="25" fill="#0f172a" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle">CERTIFIED</text>
    </g>

    <!-- Net Quantity Polygon Badge -->
    <polygon points="275,445 375,445 362,478 288,478" fill="#0f172a"/>
    <text x="325" y="468" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" text-anchor="middle">60 Tablets</text>

    <!-- FSSAI mark -->
    <text x="400" y="520" fill="#10b981" font-family="sans-serif" font-weight="900" font-size="11">fssai</text>

    <!-- Lighting Highlight -->
    <path d="M 164 185 Q 210 185 210 535 L 185 535 Q 185 225 164 205 Z" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
