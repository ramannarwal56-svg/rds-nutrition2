        <line x1="261" y1="64" x2="261" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="262.5" y1="64" x2="262.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
