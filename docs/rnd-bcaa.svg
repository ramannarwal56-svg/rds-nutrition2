    <rect x="200" y="58" width="200" height="58" rx="6" fill="url(#darkRibbedCap_bcaa)" stroke="#2e3746" stroke-width="1.2"/>

    <!-- Vertical Grooves on Cap -->
    <g stroke-linecap="round">
