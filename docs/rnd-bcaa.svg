        </text>

        <!-- Big Bold Black: 50% -->
        <text x="0" y="8" fill="#090a0f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="-0.5">50%</text>

        <!-- Lower Text: HIGHER -->
        <text x="0" y="19" fill="#090a0f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="7.5" text-anchor="middle" letter-spacing="0.5">HIGHER</text>

        <!-- Bottom Curved Arc Text: ABSORPTION -->
        <path id="sealArcBottom_bcaa" d="M -27 12 A 28 28 0 0 0 27 12" fill="none"/>
        <text fill="#090a0f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="5.5" letter-spacing="0.8">
          <textPath href="#sealArcBottom_bcaa" startOffset="50%" text-anchor="middle">ABSORPTION</textPath>
        </text>
      </g>

      
      <!-- Detailed Specs Badge -->
      <g transform="translate(160, 385)">
        <rect x="0" y="0" width="170" height="28" rx="14" fill="url(#goldFoil_bcaa)" filter="url(#goldEmboss_bcaa)"/>
        <text x="85" y="18" fill="#090a0f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">2:1:1 FERMENTED AMINOS</text>
