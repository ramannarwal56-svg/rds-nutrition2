        <line x1="289.5" y1="64" x2="289.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="297" y1="64" x2="297" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="298.5" y1="64" x2="298.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="306" y1="64" x2="306" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="307.5" y1="64" x2="307.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="315" y1="64" x2="315" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="316.5" y1="64" x2="316.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="324" y1="64" x2="324" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="325.5" y1="64" x2="325.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="333" y1="64" x2="333" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="334.5" y1="64" x2="334.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="342" y1="64" x2="342" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="343.5" y1="64" x2="343.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="351" y1="64" x2="351" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="352.5" y1="64" x2="352.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="360" y1="64" x2="360" y2="110" stroke="#060709" stroke-width="2.4"/>
        <line x1="361.5" y1="64" x2="361.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="369" y1="64" x2="369" y2="110" stroke="#060709" stroke-width="1.8"/>
        <line x1="370.5" y1="64" x2="370.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
        <line x1="378" y1="64" x2="378" y2="110" stroke="#060709" stroke-width="1.8"/>
        <line x1="379.5" y1="64" x2="379.5" y2="110" stroke="#384252" stroke-width="1.0" opacity="0.75"/>
